# Production stack on a single server:
#   docker compose --env-file .env.production -f infrastructure/docker/docker-compose.prod.yml up -d --build
#
# Caddy terminates HTTPS for SITE_DOMAIN (app) and MEDIA_DOMAIN (MinIO uploads).
# Using managed Postgres/Redis/S3 instead? Point DATABASE_URL / REDIS_URL / S3_*
# at them and remove the corresponding services below.

name: thequeue

x-app-env: &app-env
  NODE_ENV: production
  DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
  REDIS_URL: redis://redis:6379
  NEXT_PUBLIC_WEB_URL: https://${SITE_DOMAIN}
  CORS_ALLOWED_ORIGINS: https://${SITE_DOMAIN}
  SESSION_SECRET: ${SESSION_SECRET}
  ENCRYPTION_SECRET: ${ENCRYPTION_SECRET}
  S3_ENDPOINT: http://minio:9000
  S3_PUBLIC_ENDPOINT: https://${MEDIA_DOMAIN}
  S3_REGION: us-east-1
  S3_BUCKET: ${S3_BUCKET}
  S3_ACCESS_KEY: ${MINIO_ROOT_USER}
  S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
  S3_FORCE_PATH_STYLE: "true"
  SMTP_HOST: ${SMTP_HOST}
  SMTP_PORT: ${SMTP_PORT}
  SMTP_USER: ${SMTP_USER}
  SMTP_PASS: ${SMTP_PASS}
  SMTP_FROM: ${SMTP_FROM}
  STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY}
  STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET}
  STRIPE_PLATFORM_ACCOUNT_ID: ${STRIPE_PLATFORM_ACCOUNT_ID:-}
  LEGAL_ENTITY_NAME: ${LEGAL_ENTITY_NAME}
  LEGAL_CONTACT_EMAIL: ${LEGAL_CONTACT_EMAIL}
  COPYRIGHT_CONTACT_EMAIL: ${COPYRIGHT_CONTACT_EMAIL}
  LEGAL_MAILING_ADDRESS: ${LEGAL_MAILING_ADDRESS}
  GOVERNING_JURISDICTION: ${GOVERNING_JURISDICTION}
  GLOBAL_UPLOAD_LIMIT_MB: ${GLOBAL_UPLOAD_LIMIT_MB:-50}
  TRUST_PROXY_HOPS: "1"
  LOG_LEVEL: info

services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      SITE_DOMAIN: ${SITE_DOMAIN}
      MEDIA_DOMAIN: ${MEDIA_DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - web
      - api

  web:
    build:
      context: ../..
      target: web
      args:
        NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: ${NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY}
        NEXT_PUBLIC_WS_URL: /
        API_INTERNAL_URL: http://api:4000
    restart: unless-stopped
    environment:
      API_INTERNAL_URL: http://api:4000
    depends_on:
      api:
        condition: service_healthy

  api:
    build:
      context: ../..
      target: api
    restart: unless-stopped
    environment:
      <<: *app-env
      PORT: "4000"
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy

  worker:
    build:
      context: ../..
      target: worker
    restart: unless-stopped
    environment:
      <<: *app-env
      WORKER_PORT: "4001"
      WORKER_CONCURRENCY: ${WORKER_CONCURRENCY:-3}
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  # Runs on every deploy: applies migrations, then the idempotent seed
  # (creates the first Owner Admin from ADMIN_BOOTSTRAP_* once).
  migrate:
    build:
      context: ../..
      target: migrate
    restart: "no"
    environment:
      <<: *app-env
      ADMIN_BOOTSTRAP_EMAIL: ${ADMIN_BOOTSTRAP_EMAIL}
      ADMIN_BOOTSTRAP_USERNAME: ${ADMIN_BOOTSTRAP_USERNAME}
      ADMIN_BOOTSTRAP_PASSWORD: ${ADMIN_BOOTSTRAP_PASSWORD}
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      MINIO_API_CORS_ALLOW_ORIGIN: https://${SITE_DOMAIN}
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Creates the (private) media bucket once
  minio-init:
    image: minio/mc:latest
    restart: "no"
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set store http://minio:9000 $${MINIO_ROOT_USER} $${MINIO_ROOT_PASSWORD} &&
      mc mb --ignore-existing store/$${S3_BUCKET} &&
      mc anonymous set none store/$${S3_BUCKET}
      "
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      S3_BUCKET: ${S3_BUCKET}

volumes:
  postgres_data:
  redis_data:
  minio_data:
  caddy_data:
  caddy_config:
