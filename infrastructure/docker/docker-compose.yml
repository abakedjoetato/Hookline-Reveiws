version: '3.8'

services:
  # 1. PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: thequeue-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: local_postgres_secret_123
      POSTGRES_DB: thequeue_dev
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d thequeue_dev']
      interval: 5s
      timeout: 5s
      retries: 5

  # 2. Redis Cache & Job Queue Broker
  redis:
    image: redis:7-alpine
    container_name: thequeue-redis
    restart: unless-stopped
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 5

  # 3. MinIO Local S3-Compatible Object Storage
  minio:
    image: minio/minio:latest
    container_name: thequeue-minio
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: local_minio_admin
      MINIO_ROOT_PASSWORD: local_minio_secret_123
    ports:
      - '9000:9000' # S3 API Port
      - '9001:9001' # S3 Console Port
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:9000/minio/health/live']
      interval: 5s
      timeout: 5s
      retries: 5

  # 4. Auto-provisioning mechanism for MinIO buckets
  minio-provisioner:
    image: minio/mc:latest
    container_name: thequeue-minio-provisioner
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set localminio http://minio:9000 local_minio_admin local_minio_secret_123;
      if ! mc ls localminio/thequeue-media-local > /dev/null 2>&1; then
        mc mb localminio/thequeue-media-local;
        mc anonymous set public localminio/thequeue-media-local;
        echo 'Successfully created bucket: thequeue-media-local';
      else
        echo 'Bucket: thequeue-media-local already exists';
      fi
      exit 0;
      "

  # 5. Mailpit Local Email Testing
  mailpit:
    image: axllent/mailpit:v1.15
    container_name: thequeue-mailpit
    restart: unless-stopped
    ports:
      - '1025:1025' # SMTP Port
      - '8025:8025' # Web Dashboard Port
    volumes:
      - mailpit_data:/data
    environment:
      MP_DATA_FILE: /data/mailpit.db
    healthcheck:
      test: ['CMD-SHELL', 'nc -z localhost 1025 || exit 1']
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
    name: thequeue_postgres_data
  redis_data:
    name: thequeue_redis_data
  minio_data:
    name: thequeue_minio_data
  mailpit_data:
    name: thequeue_mailpit_data
