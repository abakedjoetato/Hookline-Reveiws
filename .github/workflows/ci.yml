name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: local_postgres_secret_123
          POSTGRES_DB: thequeue_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://postgres:local_postgres_secret_123@localhost:5432/thequeue_test?schema=public
      REDIS_URL: redis://localhost:6379
      S3_ENDPOINT: http://localhost:9000
      S3_REGION: us-east-1
      S3_BUCKET: thequeue-media-local
      S3_ACCESS_KEY: local_minio_admin
      S3_SECRET_KEY: local_minio_secret_123
      SMTP_HOST: localhost
      SMTP_PORT: 1025
      SMTP_FROM: noreply@thequeue.com
      SESSION_SECRET: session_secret_rotation_key_32_characters_long
      ENCRYPTION_SECRET: encryption_secret_field_key_32_characters_long
      STRIPE_SECRET_KEY: sk_test_key
      STRIPE_WEBHOOK_SECRET: whsec_key
      CORS_ALLOWED_ORIGINS: http://localhost:3000

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 10.30.3
          run_install: false

      - name: Get pnpm store directory
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - name: Cache pnpm dependencies
        uses: actions/cache@v4
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify Prisma Schema
        run: pnpm -F @platform/database db:generate

      - name: Verify formatting
        run: pnpm format:check

      - name: Run ESLint
        run: pnpm lint

      - name: Run Type Checking
        run: pnpm typecheck

      - name: Run Workspace Tests
        run: pnpm test

      - name: Build All Packages & Applications
        run: pnpm build
