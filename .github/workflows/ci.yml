name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: thequeue
          POSTGRES_PASSWORD: thequeue
          POSTGRES_DB: thequeue_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U thequeue"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://thequeue:thequeue@localhost:5432/thequeue_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build shared packages (generates Prisma client)
        run: npm run build:packages
      - name: Apply migrations to the test database
        run: npm run db:deploy
        env:
          DATABASE_URL: ${{ env.TEST_DATABASE_URL }}
      - name: Typecheck
        run: npx turbo run typecheck --filter=api --filter=worker --filter=web
      - name: Unit and database tests
        run: npx turbo run test --filter=api --filter=worker --filter=@platform/validation --filter=@platform/auth
      - name: Build apps
        run: npm run build -w apps/api && npm run build -w apps/worker && npm run build -w apps/web

  docker:
    runs-on: ubuntu-latest
    needs: verify
    strategy:
      matrix:
        target: [api, worker, web, migrate]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          target: ${{ matrix.target }}
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
